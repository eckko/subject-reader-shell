name: Check subject site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the template tag from subject.json
        id: tag
        run: |
          tag="$(python3 -c 'import json;print(json.load(open("subject.json")).get("templateTag",""))')"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::subject.json needs a templateTag such as 3.1.0 (no v, no branch)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Check out the site tools (template at that tag)
        uses: actions/checkout@v4
        with:
          repository: eckko/recall-quiz-site-template
          ref: ${{ steps.tag.outputs.tag }}
          path: .template   # a dot-folder, so the tool does not count it as a book folder
      - name: Book folders and books.json
        run: python3 .template/tools/site/build_hub.py --check
      - name: The hub shell loads the UI by one exact tag
        run: |
          tags="$(grep -o 'subject-site-template@[^/]*' index.html | sort -u)"
          n="$(printf '%s\n' "$tags" | grep -c .)"
          if [ "$n" != 1 ] || ! printf '%s' "$tags" | grep -Eq '^subject-site-template@[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::index.html must load subject-site-template by one exact tag (found: $tags)"
            exit 1
          fi
