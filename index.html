<!doctype html>
<!--
  The hub page of a subject site. It lists the books in books.json (written
  by tools/build_hub.py) as cards with two buttons: Read book and Test only.
  A button is greyed out when the book does not have that view. Each opens
  <folder>/index.html?view=..., which asks for the key itself (sign in with
  Google or paste it), then starts the reader or the quiz from the CDN.
  The cards show a letter, never a book cover: covers are encrypted.
  The subject's name comes from subject.json. No book content lives here.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6f6a'/%3E%3Cpath d='M9 8h10a4 4 0 0 1 4 4v12H13a4 4 0 0 1-4-4z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5b6470;
      --line: #d5dae1;
      --accent: #2b59c3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #14171c;
        --card: #1e232b;
        --text: #e8ebef;
        --muted: #a2abb7;
        --line: #343b46;
        --accent: #8fb0ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 52rem;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }
    h1 { margin: 0 0 .25rem; font-size: 1.75rem; }
    .count { margin: 0 0 1.5rem; color: var(--muted); }
    .books {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr));
      gap: 1rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .book {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
      height: 100%;
      padding: 1rem .75rem;
      border: 1px solid var(--line);
      border-radius: .75rem;
      background: var(--card);
      color: var(--text);
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem;
      margin-top: auto; width: 100%; }
    .action { flex: 1 1 6rem; padding: .5rem .75rem; border: 1px solid var(--accent);
      border-radius: .5rem; color: var(--accent); font-weight: 600; text-decoration: none; }
    .action.primary { background: var(--accent); color: var(--page); }
    .action:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .action[aria-disabled="true"] { border-color: var(--line); background: transparent;
      color: var(--muted); opacity: .6; cursor: not-allowed; }
    .icon {
      flex: none;
      width: 5rem;
      height: 5rem;
      border-radius: 1rem;
      object-fit: cover;
    }
    .icon.missing {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent);
    }
    .name { font-weight: 600; }
    .note { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Books</h1>
    <p class="count" id="count" aria-live="polite">Loading…</p>
    <ul class="books" id="books"></ul>
  </main>
  <script>
    (function showHub() {
      "use strict";

      var heading = document.getElementById("heading");
      var count = document.getElementById("count");
      var list = document.getElementById("books");

      /**
       * @param {string} file  a file next to this page
       * @returns {Promise<object>} the parsed JSON
       */
      function loadJson(file) {
        return fetch(file, { cache: "no-cache" }).then(function read(reply) {
          if (!reply.ok) {
            throw new Error(file + ": HTTP " + reply.status);
          }
          return reply.json();
        });
      }

      /**
       * @param {object} book  one entry of books.json
       * @returns {HTMLElement} a letter tile (book covers are encrypted)
       */
      function makeIcon(book) {
        var letter = document.createElement("span");
        letter.className = "icon missing";
        letter.setAttribute("aria-hidden", "true");
        letter.textContent = (book.title || "?").charAt(0).toUpperCase();
        return letter;
      }

      /**
       * @param {object} book  one entry of books.json
       * @returns {HTMLElement} the list item with the book's button
       */
      function makeButton(book) {
        var item = document.createElement("li");
        var card = document.createElement("div");
        var name = document.createElement("span");
        var actions = document.createElement("div");
        var views = book.views || [];
        card.className = "book";
        name.className = "name";
        name.textContent = book.title;
        actions.className = "actions";
        actions.appendChild(makeAction("Read book", book, "read", views));
        actions.appendChild(makeAction("Test only", book, "quiz", views));
        card.appendChild(makeIcon(book));
        card.appendChild(name);
        card.appendChild(actions);
        item.appendChild(card);
        return item;
      }

      /**
       * @param {string} label  button text
       * @param {object} book   one entry of books.json
       * @param {string} view   "read" or "quiz"
       * @param {string[]} views  the views this book has
       * @returns {HTMLElement} a link, or a greyed-out button when the book
       *   has no such view (the book page asks for the key itself)
       */
      function makeAction(label, book, view, views) {
        var has = views.indexOf(view) !== -1;
        var action = document.createElement(has ? "a" : "span");
        action.className = "action" + (view === "read" ? " primary" : "");
        action.textContent = label;
        if (has) {
          action.href = encodeURIComponent(book.folder) + "/index.html?view=" + view;
        } else {
          action.setAttribute("aria-disabled", "true");
          action.title = "Not available for this book yet";
        }
        return action;
      }

      /**
       * @param {object} subject  subject.json
       * @param {object} index    books.json
       */
      function render(subject, index) {
        var books = index.books || [];
        if (subject.title) {
          heading.textContent = subject.title;
          document.title = subject.title;
        }
        books.forEach(function add(book) {
          list.appendChild(makeButton(book));
        });
        count.textContent = books.length === 0 ? "No books yet." :
          books.length + (books.length === 1 ? " book" : " books");
      }

      Promise.all([loadJson("subject.json"), loadJson("books.json")])
        .then(function done(files) { render(files[0], files[1]); })
        .catch(function failed() {
          count.className = "count note";
          count.textContent = "The book list could not be loaded. " +
            "Open this page through a web server, not from a folder.";
        });
    })();
  </script>
</body>
</html>
