<!doctype html>
<!--
  The hub page of a subject site. It lists the books in books.json (written
  by tools/build_hub.py) as buttons and opens <folder>/ (a reader page that
  loads its code from the CDN and decrypts the book in the browser).
  The buttons show a letter, never a book cover: covers are encrypted.
  The subject's name comes from subject.json. No book content lives here.
  One key opens every book of the subject: enter it once below; it is kept
  only for this browser tab (sessionStorage) and read by the book pages.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6f6a'/%3E%3Cpath d='M9 8h10a4 4 0 0 1 4 4v12H13a4 4 0 0 1-4-4z' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5b6470;
      --line: #d5dae1;
      --accent: #2b59c3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #14171c;
        --card: #1e232b;
        --text: #e8ebef;
        --muted: #a2abb7;
        --line: #343b46;
        --accent: #8fb0ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      max-width: 52rem;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }
    h1 { margin: 0 0 .25rem; font-size: 1.75rem; }
    .count { margin: 0 0 1.5rem; color: var(--muted); }
    .books {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr));
      gap: 1rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .book {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
      height: 100%;
      padding: 1rem .75rem;
      border: 1px solid var(--line);
      border-radius: .75rem;
      background: var(--card);
      color: var(--text);
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .book:hover { border-color: var(--accent); }
    .book:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .icon {
      flex: none;
      width: 5rem;
      height: 5rem;
      border-radius: 1rem;
      object-fit: cover;
    }
    .icon.missing {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent);
    }
    .name { font-weight: 600; }
    .note { color: var(--muted); }
    .key { margin: 0 0 1.5rem; }
    .key summary { cursor: pointer; color: var(--muted); font-weight: 600; }
    .key form { display: flex; gap: .5rem; margin-top: .5rem; flex-wrap: wrap; }
    .key input { flex: 1; min-width: 12rem; padding: .5rem; border: 1px solid var(--line);
      border-radius: .5rem; background: var(--card); color: var(--text); font: inherit; }
    .key button { padding: .5rem 1rem; border: 1px solid var(--accent); border-radius: .5rem;
      background: var(--accent); color: var(--page); font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Books</h1>
    <p class="count" id="count" aria-live="polite">Loading…</p>
    <details class="key" id="keybox">
      <summary id="keystatus">Key: not set for this tab</summary>
      <form id="keyform" autocomplete="off">
        <input id="keyinput" type="password" placeholder="64 hex characters" aria-label="Subject key">
        <button type="submit">Unlock</button>
      </form>
    </details>
    <ul class="books" id="books"></ul>
  </main>
  <script>
    (function showHub() {
      "use strict";

      var heading = document.getElementById("heading");
      var count = document.getElementById("count");
      var list = document.getElementById("books");

      /**
       * @param {string} file  a file next to this page
       * @returns {Promise<object>} the parsed JSON
       */
      function loadJson(file) {
        return fetch(file, { cache: "no-cache" }).then(function read(reply) {
          if (!reply.ok) {
            throw new Error(file + ": HTTP " + reply.status);
          }
          return reply.json();
        });
      }

      /**
       * @param {object} book  one entry of books.json
       * @returns {HTMLElement} a letter tile (book covers are encrypted)
       */
      function makeIcon(book) {
        var letter = document.createElement("span");
        letter.className = "icon missing";
        letter.setAttribute("aria-hidden", "true");
        letter.textContent = (book.title || "?").charAt(0).toUpperCase();
        return letter;
      }

      /**
       * @param {object} book  one entry of books.json
       * @returns {HTMLElement} the list item with the book's button
       */
      function makeButton(book) {
        var item = document.createElement("li");
        var link = document.createElement("a");
        var name = document.createElement("span");
        link.className = "book";
        link.href = encodeURIComponent(book.folder) + "/";
        name.className = "name";
        name.textContent = book.title;
        link.appendChild(makeIcon(book));
        link.appendChild(name);
        item.appendChild(link);
        return item;
      }

      /**
       * @param {object} subject  subject.json
       * @param {object} index    books.json
       */
      function render(subject, index) {
        var books = index.books || [];
        if (subject.title) {
          heading.textContent = subject.title;
          document.title = subject.title;
        }
        books.forEach(function add(book) {
          list.appendChild(makeButton(book));
        });
        count.textContent = books.length === 0 ? "No books yet." :
          books.length + (books.length === 1 ? " book" : " books");
      }

      /** Keep the subject key for this tab only; the book pages read it. */
      function setupKey() {
        var status = document.getElementById("keystatus");
        var input = document.getElementById("keyinput");
        function show() {
          var has = false;
          try { has = !!sessionStorage.getItem("trial-key"); } catch (e) { has = false; }
          status.textContent = has ? "Key: set for this tab" : "Key: not set for this tab";
        }
        var fromAddress = (location.hash.match(/key=([0-9a-f]{64})/i) || [])[1];
        if (fromAddress) {
          try { sessionStorage.setItem("trial-key", fromAddress); } catch (e) { /* none */ }
          history.replaceState(null, "", location.pathname + location.search);
        }
        document.getElementById("keyform").addEventListener("submit", function save(event) {
          event.preventDefault();
          if (/^[0-9a-f]{64}$/i.test(input.value.trim())) {
            try { sessionStorage.setItem("trial-key", input.value.trim()); } catch (e) { /* none */ }
            input.value = "";
            show();
          }
        });
        show();
      }
      setupKey();

      Promise.all([loadJson("subject.json"), loadJson("books.json")])
        .then(function done(files) { render(files[0], files[1]); })
        .catch(function failed() {
          count.className = "count note";
          count.textContent = "The book list could not be loaded. " +
            "Open this page through a web server, not from a folder.";
        });
    })();
  </script>
</body>
</html>
