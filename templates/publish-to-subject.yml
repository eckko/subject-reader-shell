# Publishes this book into a subject site. It lives in the book shell, so
# every new book repo starts with it. Set SUBJECT_REPO below and add the
# secret SUBJECT_REPO_TOKEN; until SUBJECT_REPO is set the workflow does
# nothing.
#
# It publishes only index.html, book.json, data/ and media/ (all of data/
# and media/ is encrypted) into the subject site's folder for this book.
# Nothing else in the book repo is read, so references and notes stay private.
#
# One-time setup:
#   1. Create a fine-grained personal access token for the subject repo
#      only, with "Contents: Read and write".
#   2. Save it in this book repo as the secret SUBJECT_REPO_TOKEN
#      (Settings > Secrets and variables > Actions).
name: Publish to subject site

on:
  push:
    branches: [main]
    paths:
      - index.html
      - book.json
      - data/**
      - media/**
      - .github/workflows/publish-to-subject.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-to-subject
  cancel-in-progress: false

env:
  SUBJECT_REPO: YOUR_USER/YOUR_SUBJECT_REPO
  # The folder (and URL name) of the book: lower-case letters, digits, dashes.
  BOOK_FOLDER: ${{ github.event.repository.name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check the setup
        id: setup
        env:
          TOKEN: ${{ secrets.SUBJECT_REPO_TOKEN }}
        run: |
          if [[ "$SUBJECT_REPO" == *YOUR_* ]]; then
            echo "::notice::SUBJECT_REPO is not set in this workflow; nothing published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$TOKEN" ]; then
            echo "::error::The secret SUBJECT_REPO_TOKEN is missing."
            exit 1
          fi

      - name: Check out this book repo
        if: steps.setup.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          path: book

      - name: Check out the subject site
        if: steps.setup.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SUBJECT_REPO }}
          token: ${{ secrets.SUBJECT_REPO_TOKEN }}
          path: subject

      - name: Publish
        if: steps.setup.outputs.skip != 'true'
        run: subject/tools/publish_book.sh "$PWD/book" "$BOOK_FOLDER"
